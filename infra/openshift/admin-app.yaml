apiVersion: apps/v1
kind: Deployment
metadata:
  name: mylineup-admin-app
  labels:
    app: mylineup-admin-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mylineup-admin-app
  template:
    metadata:
      labels:
        app: mylineup-admin-app
    spec:
      containers:
        - name: mylineup-admin-app
          image: ghcr.io/sebastiancie/mylineup-admin-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mylineup-admin-app
  labels:
    app: mylineup-admin-app
spec:
  selector:
    app: mylineup-admin-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mylineup-admin-app
  labels:
    app: mylineup-admin-app
spec:
  to:
    kind: Service
    name: mylineup-admin-app
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
