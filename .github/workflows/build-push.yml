name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: api
            build-args: ""
          - name: admin-app
            context: admin-app
            build-args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
              VITE_USER_APP_URL=${{ vars.VITE_USER_APP_URL }}
          - name: user-app
            context: user-app
            build-args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/mylineup-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/mylineup-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
