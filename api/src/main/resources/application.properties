# --- Datasource (überschreibbar per Env: DB_URL, DB_USER, DB_PASSWORD) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:mylineup}
quarkus.datasource.password=${DB_PASSWORD:mylineup}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/mylineup}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- JWT: eigene, selbst signierte Tokens (kein externer Auth-Provider) ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:https://mylineup.local}
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=${JWT_ISSUER:https://mylineup.local}
smallrye.jwt.new-token.lifespan=86400

# --- CORS (Dev: React-Apps laufen auf anderen Ports) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/http://localhost:.*/}

# --- Health ---
quarkus.smallrye-health.root-path=/q/health
